---
# Sends and runs the router_config.j2 configuration to the Cisco Catalyst 8000V router located in VPC3
# Host is tagged in terraform with Role = router
#
# How to run:
#   ansible-playbook \
#     -i ansible/inventory/aws_ec2.yml \
#     -e "ansible_ssh_private_key_file=${{ secrets.EC2_INSTANCES_PRIVATE_KEY }}" \
#     ansible/playbooks/router_config.yml
#
# **MUST HAVE output.json LOCATED IN THE ansible/group_vars/all FOLDER** 
# - see README for how and where to store the output.json from Terraform

- name: Render and deploy per-router configuration
#  hosts: tag_Role_router
  hosts: routers
  gather_facts: false

  tasks:

    - name: Get show version
      cisco.ios.ios_command:
        commands:
          - show version
      register: version_output

    - name: Render base config from template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/router_config.j2"
        dest: "/tmp/router_config.cfg"
      delegate_to: localhost

    - name: Push rendered config to the device
      cisco.ios.ios_config:
        src: "/tmp/router_config.cfg"