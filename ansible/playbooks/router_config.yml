---
# Sends and runs the router_config.j2 configuration to the Cisco Catalyst 8000V router located in VPC3
# Host is tagged in terraform with Role = router
#
# Requires the cisco.ios collection:
#   ansible-galaxy collection install cisco.ios
#
# How to run:
#   ansible-playbook \
#     -i ansible/inventory/aws_ec2.yml \
#     -e "cisco_password=${{ secrets.CISCO_PASSWORD }}"
#     ansible/playbooks/router_config.yml
#
# **MUST HAVE output.json LOCATED IN THE ansible/inventory/group_vars/all FOLDER** 
# - see README for how and where to store the output.json from Terraform

- name: Render and deploy per-router configuration
  hosts: tag_Role_router
  gather_facts: false

  tasks:

    - name: Wait for router to come back after reload
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        delay: 60
        timeout: 900
        state: started
      delegate_to: localhost

    - name: Get show version
      cisco.ios.ios_command:
        commands:
          - show version
      register: version_output
      retries: 5
      delay: 30
      until: version_output is succeeded
      vars:
        ansible_command_timeout: 3600
        
    - name: Remove old rendered config file
      ansible.builtin.file:
        path: /tmp/router_config.cfg
        state: absent
      delegate_to: localhost

    - name: Render base config from template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/router_config.j2"
        dest: "/tmp/router_config.cfg"
      delegate_to: localhost

    - name: Push rendered config to the device
      cisco.ios.ios_config:
        src: "/tmp/router_config.cfg"
