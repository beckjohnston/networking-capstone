# roles/bastion/tasks/main.yml - Harden and configure the bastion host
---
- name: Update all packages to latest versions
  apt:
    upgrade: dist
    update_cache: yes

- name: Install security and monitoring packages
  apt:
    name:
      - fail2ban
      - ufw
      - auditd
      - audispd-plugins
      - unattended-upgrades
      - logwatch
      - tmux
      - mosh
    state: present

- name: Create bastion user accounts
  user:
    name: "{{ item.name }}"
    shell: /bin/bash
    create_home: yes
    groups: []
    state: present
  loop: "{{ bastion_users }}"

- name: Deploy SSH authorized keys for each user
  authorized_key:
    user: "{{ item.name }}"
    key: "{{ item.ssh_key }}"
    exclusive: yes
    state: present
  loop: "{{ bastion_users }}"

- name: Harden SSH server configuration
  template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0600'
    validate: "sshd -t -f %s"
  notify: restart sshd

- name: Configure fail2ban for SSH protection
  template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: '0644'
  notify: restart fail2ban

- name: Configure UFW firewall rules
  include_tasks: firewall.yml

#For if seesion recording is desired
#- name: Configure audit logging
#  include_tasks: audit.yml

#- name: Configure session recording
#  include_tasks: session_recording.yml
#  when: bastion_session_recording

- name: Enable automatic security updates
  template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: '0644'

- name: Ensure all security services are running
  systemd:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - fail2ban
    - auditd
    - ufw