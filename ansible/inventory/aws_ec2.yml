plugin: amazon.aws.aws_ec2
regions:
  - us-east-1

# Filter to only instances belonging to this project (set by Terraform default_tags)
filters:
  tag: Project: capstone
  instance-state-name: running

# Group hosts by their Role tag - playbooks target tag_Role_bastion,
# tag_Role_private_app, tag_Role_router instead of hardcoded IPs.
keyed_groups:
  - key: ec2_tags.Role
    prefix: tag_Role
    separator: "_"

# Public IP for bastion and router (publicly reachable);
# private IP as fallback for instances with no public IP.
hostnames:
  - ip-address
  - private-ip-address
