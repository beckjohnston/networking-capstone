name: _reusable-terraform

on:
  workflow_call:
    inputs:
      command:
        description: "plan | apply"
        required: true
        type: string
      working-directory:
        required: false
        type: string
        default: terraform
      environment:
        description: "GitHub Environment to run under (enables required approval before apply)"
        required: false
        type: string
        default: ""
      post-pr-comment:
        required: false
        type: boolean
        default: false
    outputs:
      exitcode:
        description: "terraform plan detailed exit code (0 = no changes, 1 = error, 2 = changes present)"
        value: ${{ jobs.terraform.outputs.exitcode }}

permissions:
  id-token: write 
  contents: read
  pull-requests: write
jobs:
  terraform:
    name: terraform ${{ inputs.command }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment != '' && inputs.environment || null }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: true

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=networking-capstone/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-west-1' }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Terraform Validate
        run: terraform validate


      - name: Security scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ inputs.working-directory }}
          soft_fail: true

      - name: Terraform Plan
        id: plan
        if: inputs.command == 'plan'
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan.binary
          code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          terraform show -no-color tfplan.binary > plan_output.txt
          # 0 = no changes, 1 = real error, 2 = changes present (not an error)
          if [ $code -eq 1 ]; then exit 1; fi
          exit 0

      - name: Upload plan artifact
        if: inputs.command == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ inputs.working-directory }}/tfplan.binary
          retention-days: 5

      - name: Post plan as PR comment
        if: inputs.command == 'plan' && inputs.post-pr-comment == true && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `${{ inputs.working-directory }}/plan_output.txt`;
            let plan = fs.readFileSync(path, 'utf8');
            const maxLen = 60000;
            if (plan.length > maxLen) {
              plan = plan.slice(0, maxLen) + "\n\n... (truncated)";
            }
            const marker = '<!-- terraform-plan-comment -->';
            const body = `${marker}\n### Terraform Plan Result\n\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Terraform Apply
        if: inputs.command == 'apply'
        run: terraform apply -input=false -auto-approve -no-color
