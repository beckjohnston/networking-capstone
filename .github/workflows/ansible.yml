name: Ansible

on:
  workflow_call:
    inputs:
      deployment_ref:
        required: false
        default: "stable"
        type: string
      playbook:
        description: "Playbook to run (relative to ansible/playbooks/)"
        required: true
        type: string
  workflow_dispatch: 
    inputs:
      deployment_ref:
        required: false
        default: "stable"
        type: string
      playbook:
        required: true
        default: "verify_connectivity.yml"
        type: choice
        options:
          - verify_connectivity.yml
          - install_observability.yml
          - router_config.yml
          - router_init.yml
  
permissions:
  contents: read
  pull-requests: write

env:
  KEY_PATH: /tmp/ec2-key.pem
  DEPLOYMENT_REF: ${{ inputs.deployment_ref || github.event.inputs.deployment_ref || 'stable' }}
  PLAYBOOK: ${{ inputs.playbook || github.event.inputs.playbook || 'verify_connectivity.yml' }}

jobs:
  run-playbook:
    name: Run Playbook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected deployment ref
        uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        with:
          ref: ${{ env.DEPLOYMENT_REF }}

      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: configure ssh key and permissions
        run: |
          printf '%s\n' "${{ secrets.EC2_INSTANCES_PRIVATE_KEY }}" > ${{ env.KEY_PATH }}
          chmod 400 ${{ env.KEY_PATH }}
  
      - name: Install Ansible and AWS collection
        run: |
          pip install ansible boto3 botocore
          pip install paramiko
          ansible-galaxy collection install amazon.aws community.docker

      - name: Dry-run diff 
        id : ansible
        if: env.PLAYBOOK != 'router_config.yml' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run : |
            OUTPUT=$(
              echo "=================== VERIFY_CONNECTIVITY DRY RUN =====================" 
              ansible-playbook --check --diff \
              -i ansible/inventory/aws_ec2.yml \
              -e "ansible_ssh_private_key_file=${{ env.KEY_PATH }}" \
              ansible/playbooks/${{ env.PLAYBOOK }} 2>&1
              
              echo "=================== INSTALL_OBSERVABILITY.YML DRY RUN =====================" 
              ansible-playbook --check --diff \
              -i ansible/inventory/aws_ec2.yml \
              -e "ansible_ssh_private_key_file=${{ env.KEY_PATH }}" \
              -e "grafana_admin_password=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
              ansible/playbooks/install_observability.yml

              echo "=================== ROUTER_INIT.YML DRY RUN ====================="
              ansible-galaxy collection install cisco.ios
              ansible-playbook --check --diff \
              -i ansible/inventory/aws_ec2.yml \
              -e "ansible_ssh_private_key_file=${{ env.KEY_PATH }}" \
              -e "cisco_password=${{ secrets.CISCO_PASSWORD }}" \
              ansible/playbooks/router_init.yml
              
              echo "=================== ROUTER_CONFIG.YML DRY RUN =====================" 
              ansible-galaxy collection install cisco.ios
              mkdir "${GITHUB_WORKSPACE}/ansible/inventory/group_vars/all"
              terraform -chdir=terraform output -json > "${GITHUB_WORKSPACE}/ansible/inventory/group_vars/all/output.json"
              ansible-playbook \
              -i ansible/inventory/aws_ec2.yml \
              -e "ansible_ssh_private_key_file=" \
              -e "cisco_password=${{ secrets.CISCO_PASSWORD }}" \
              ansible/playbooks/router_config.yml
              ) || true
              echo "ansible_output<<EOF" >> $GITHUB_OUTPUT
              echo "$OUTPUT" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Post dry run to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ANSIBLE_OUTPUT: ${{ steps.ansible.outputs.ansible_output }}
        with:
          script: |
            const output = "```\n" + process.env.ANSIBLE_OUTPUT + "\n```";
            await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output,
              });

      - name: Run verify playbook
        if: github.event.inputs.playbook  == 'verify_connectivity.yml' || github.event_name == 'pull_request'
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          ansible-playbook \
            -i ansible/inventory/aws_ec2.yml \
            -e "ansible_ssh_private_key_file=${{ env.KEY_PATH }}" \
            ansible/playbooks/verify_connectivity.yml

      - name: Run install observability playbook
        if: env.PLAYBOOK  == 'install_observability.yml' || github.event_name == 'pull_request'
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          ansible-playbook \
          -i ansible/inventory/aws_ec2.yml \
          -e "ansible_ssh_private_key_file=${{ env.KEY_PATH }}" \
          -e "grafana_admin_password=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
          ansible/playbooks/install_observability.yml

      - name: Setup Terraform
        if: (github.event.inputs.playbook == 'router_config.yml' || github.event.inputs.playbook == 'router_init.yml') || github.event_name == 'pull_request'
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        if: (github.event.inputs.playbook == 'router_config.yml' || github.event.inputs.playbook == 'router_init.yml') || github.event_name == 'pull_request'
        working-directory: ./terraform   
        run: terraform init
              
      - name: Run router init playbook
        if: env.PLAYBOOK == 'router_init.yml' || github.event_name == 'pull_request'
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
            ansible-galaxy collection install cisco.ios
            ansible-playbook \
              -i ansible/inventory/aws_ec2.yml \
              -e "ansible_ssh_private_key_file=${{ env.KEY_PATH }}" \
              -e "cisco_password=${{ secrets.CISCO_PASSWORD }}" \
              ansible/playbooks/router_init.yml

      - name: Run router config playbook
        if: env.PLAYBOOK == 'router_config.yml' || github.event_name == 'pull_request'
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
            ansible-galaxy collection install cisco.ios
            mkdir "${GITHUB_WORKSPACE}/ansible/inventory/group_vars/all"
            terraform -chdir=terraform output -json > "${GITHUB_WORKSPACE}/ansible/inventory/group_vars/all/output.json"
            ansible-playbook \
            -i ansible/inventory/aws_ec2.yml \
            -e "ansible_ssh_private_key_file=" \
            -e "cisco_password=${{ secrets.CISCO_PASSWORD }}" \
            ansible/playbooks/router_config.yml
        
      - name: Clean up key
        if: always()
        run: rm -f ssh-key.pem
