name: Terraform Drift Detection

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: terraform-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Check Terraform Drift
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log("OIDC audience:", payload.aud);
            console.log("OIDC subject:", payload.sub);
            console.log("Repository:", payload.repository);
            console.log("Repository ID:", payload.repository_id);
            console.log("Repository owner:", payload.repository_owner);
            console.log("Repository owner ID:", payload.repository_owner_id);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=networking-capstone/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-west-1' }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Check for Drift
        id: drift
        run: |
          set +e

          terraform plan \
            -input=false \
            -no-color \
            -detailed-exitcode \
            > drift-plan.txt 2>&1

          EXITCODE=$?

          echo "exitcode=$EXITCODE" >> "$GITHUB_OUTPUT"

          cat drift-plan.txt

          if [ "$EXITCODE" -eq 1 ]; then
            echo "Terraform plan failed."
            exit 1
          fi

          exit 0

      - name: Add Drift Report to Job Summary
        if: steps.drift.outputs.exitcode == '2'
        run: |
          echo "## Terraform Drift Detected" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```hcl' >> "$GITHUB_STEP_SUMMARY"
          cat drift-plan.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Issue
        if: steps.drift.outputs.exitcode == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Terraform drift detected" \
            --body-file drift-plan.txt

      - name: Fail Workflow if Drift Exists
        if: steps.drift.outputs.exitcode == '2'
        run: |
          echo "Infrastructure drift detected."
          echo "Recovery must be completed through a pull request."
          exit 1