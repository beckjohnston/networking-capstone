name: Terraform

on:
  workflow_call:
    inputs:
      deployment_ref:
        description: "Git ref or tag to deploy (defaults to stable)"
        required: false
        default: "stable"
        type: string
      action:
        description: "plan, apply or destroy"
        required: true
        default: "apply"
        type: string
  workflow_dispatch: 
    inputs:
      deployment_ref:
        description: "Git ref or tag to deploy (defaults to stable)"
        required: false
        default: "stable"
        type: string
      action:
        description: "plan, apply or destroy"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy
          - plan

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.10.x"
  WORKING_DIR: ./terraform
  DEPLOYMENT_REF: ${{ inputs.deployment_ref || github.event.inputs.deployment_ref || 'stable' }}

jobs:
  terraform-plan:
    name: Plan
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply')) ||
      (github.event_name == 'workflow_call' &&
       (inputs.action == 'plan' || inputs.action == 'apply'))
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout selected deployment ref
        uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        with:
          ref: ${{ env.DEPLOYMENT_REF }}

      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call'

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -no-color #| tee /tmp/tfplan.txt
        #run: terraform plan -input=false -var="grafana_admin_password=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" | tee /tmp/tfplan.txt

      - name: Post Plan to Summary
        run: echo "${{ steps.plan.outputs.stdout }}" >> $GITHUB_STEP_SUMMARY
      #  run: cat /tmp/tfplan.txt >> $GITHUB_STEP_SUMMARY

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `\`\`\` ${{ steps.plan.outputs.stdout }} \`\`\``;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: output
            });

  approval:
    runs-on: ubuntu-latest
    needs: terraform-plan
    steps:
      - name: Wait for Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.TOKEN }}
          approvers: aowens04
            
  terraform-apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: approval
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply') ||
      (github.event_name == 'workflow_call' && inputs.action == 'apply')
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout selected deployment ref
        uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        with:
          ref: ${{ env.DEPLOYMENT_REF }}

      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call'

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      #- name: Terraform Validate
      #  run: terraform validate

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false #| tee /tmp/tfplan.txt
        #run: terraform apply -auto-approve -input=false -var="grafana_admin_password=${{ secrets.GRAFANA_ADMIN_PASSWORD }}"

  terraform-destroy:
    name: Destroy
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy') ||
      (github.event_name == 'workflow_call' && inputs.action == 'destroy')
    needs: approval
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout selected deployment ref
        uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        with:
          ref: ${{ env.DEPLOYMENT_REF }}

      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call'

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false
        
        #run: terraform destroy -auto-approve -input=false -var="grafana_admin_password=${{ secrets.GRAFANA_ADMIN_PASSWORD }}"
