name: Terraform

on:
  pull_request:
    branches: [ main ]
    inputs:
      action:
        description: "plan, apply or destroy"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy
          - plan

permissions:
  contents: read

env:
  TF_VERSION: "1.10.x"
  WORKING_DIR: ./terraform

jobs:
  terraform-plan:
    name: Plan
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'plan'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -var="grafana_admin_password=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" | tee /tmp/tfplan.txt

      - name: Post Plan to Summary
        run: cat /tmp/tfplan.txt >> $GITHUB_STEP_SUMMARY

      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.ansible.outputs.ansible_output }}`;
            
